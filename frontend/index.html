<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天助手</title>

    <!-- Markdown 渲染 + 代码高亮 + XSS 防护（CDN） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 认证页面样式 */
        .auth-page {
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.5s ease-in;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #666;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .switch-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9em;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        /* 聊天页面样式 */
        .chat-page {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .chat-page.active {
            display: flex;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.5em;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .username {
            font-weight: 500;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-logout:hover {
            background: white;
            color: #667eea;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .welcome-message {
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-size: 1.1em;
        }

        .message {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.assistant {
            align-self: flex-start;
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
        }

        /* Markdown 渲染样式（仅对 assistant 生效） */
        .message.assistant h1,
        .message.assistant h2,
        .message.assistant h3 {
            margin: 0.6em 0 0.3em;
            color: #333;
        }
        .message.assistant h1 { font-size: 1.4em; }
        .message.assistant h2 { font-size: 1.2em; }
        .message.assistant h3 { font-size: 1.05em; }
        .message.assistant p {
            margin: 0.4em 0;
            line-height: 1.6;
        }
        .message.assistant p:first-child { margin-top: 0; }
        .message.assistant p:last-child { margin-bottom: 0; }
        .message.assistant ul,
        .message.assistant ol {
            margin: 0.4em 0;
            padding-left: 1.4em;
        }
        .message.assistant li { margin: 0.2em 0; }
        .message.assistant code {
            background: #f4f4f8;
            color: #e83e8c;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9em;
        }
        .message.assistant pre {
            background: #282c34;
            color: #abb2bf;
            padding: 12px 14px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.5em 0;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .message.assistant pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: inherit;
        }
        .message.assistant blockquote {
            margin: 0.5em 0;
            padding: 0.2em 0.8em;
            border-left: 3px solid #667eea;
            color: #666;
            background: #f8f9fa;
        }
        .message.assistant a {
            color: #667eea;
            text-decoration: none;
        }
        .message.assistant a:hover {
            text-decoration: underline;
        }
        .message.assistant table {
            border-collapse: collapse;
            margin: 0.6em 0;
            font-size: 0.9em;
        }
        .message.assistant th,
        .message.assistant td {
            border: 1px solid #e0e0e0;
            padding: 6px 10px;
        }
        .message.assistant th {
            background: #f4f4f8;
            font-weight: 600;
        }

        .message.error {
            align-self: center;
            background: #ffe0e0;
            color: #d32f2f;
            border: 1px solid #ffcdd2;
        }

        .chat-input-area {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            transition: all 0.3s;
            min-height: 50px;
            max-height: 150px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #ffa502;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-clear:hover {
            background: #ff9500;
        }

        /* 流式生成中的占位气泡 */
        .message.streaming {
            position: relative;
        }
        .message.streaming::after {
            content: '▍';
            margin-left: 2px;
            animation: blink 1s steps(1) infinite;
            color: #667eea;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        /* 三点跳动 loading */
        .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #667eea;
            animation: dotBounce 1.2s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-4px); opacity: 1; }
        }
        /* 停止生成按钮：发送中替换发送按钮 */
        .btn-stop {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(238, 90, 82, 0.4);
        }

        /* ===== 会话侧边栏 ===== */
        .chat-page {
            flex-direction: row !important;
        }
        .conversation-sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #f7f8fc;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-top {
            padding: 16px;
            border-bottom: 1px solid #e8e8ef;
        }
        .btn-new-conv {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-new-conv:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }
        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .conv-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 14px;
            color: #333;
            transition: background 0.15s;
        }
        .conv-item:hover {
            background: #eef0f7;
        }
        .conv-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .conv-item .conv-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item .conv-del {
            background: transparent;
            border: none;
            color: inherit;
            opacity: 0;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .conv-item:hover .conv-del {
            opacity: 0.7;
        }
        .conv-item .conv-del:hover {
            opacity: 1;
        }
        .conv-item.active .conv-del {
            color: white;
        }
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .sidebar-toggle {
            display: none;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-right: 8px;
        }
        @media (max-width: 768px) {
            .conversation-sidebar {
                position: absolute;
                left: -260px;
                top: 0;
                bottom: 0;
                z-index: 50;
                transition: left 0.25s;
            }
            .conversation-sidebar.open {
                left: 0;
            }
            .sidebar-toggle {
                display: inline-block;
            }
        }

        /* 动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .auth-card {
                padding: 30px 20px;
            }

            .chat-header {
                padding: 15px 20px;
            }

            .chat-messages {
                padding: 20px;
            }

            .chat-input-area {
                padding: 15px 20px;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录/注册页面 -->
        <div class="auth-page" id="authPage">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>🤖 AI聊天助手</h1>
                    <p>智能对话，畅享未来</p>
                </div>

                <!-- 登录表单 -->
                <div id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">用户名</label>
                        <input type="text" id="loginUsername" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <input type="password" id="loginPassword" placeholder="请输入密码">
                    </div>
                    <button class="btn btn-primary" onclick="handleLogin()">登 录</button>
                    <div class="switch-text">
                        还没有账号？<a onclick="showRegister()">立即注册</a>
                    </div>
                </div>

                <!-- 注册表单 -->
                <div id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label for="regUsername">用户名</label>
                        <input type="text" id="regUsername" placeholder="3-20个字符">
                    </div>
                    <div class="form-group">
                        <label for="regEmail">邮箱（可选）</label>
                        <input type="email" id="regEmail" placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">密码</label>
                        <input type="password" id="regPassword" placeholder="至少6个字符">
                    </div>
                    <button class="btn btn-primary" onclick="handleRegister()">注 册</button>
                    <button class="btn btn-secondary" onclick="showLogin()">返回登录</button>
                </div>

                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>

        <!-- 聊天页面 -->
        <div class="chat-page" id="chatPage">
            <!-- 会话侧边栏 -->
            <aside class="conversation-sidebar" id="convSidebar">
                <div class="sidebar-top">
                    <button class="btn-new-conv" onclick="createNewConversation()">+ 新建对话</button>
                </div>
                <div class="conv-list" id="convList"></div>
            </aside>

            <!-- 主聊天区 -->
            <div class="chat-main">
                <div class="chat-header">
                    <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="侧边栏">�</button>
                    <h2>🤖 AI聊天助手 <span id="currentConvTitle" style="font-size:0.6em;color:#ddd;margin-left:8px;"></span></h2>
                    <div class="user-info">
                        <span class="username" id="currentUsername"></span>
                        <button class="btn-logout" onclick="handleLogout()">退出登录</button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message">
                        <p>欢迎使用AI聊天助手！开始对话吧~</p>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea
                            class="chat-input"
                            id="messageInput"
                            placeholder="输入消息... (按 Enter 发送，Shift+Enter 换行)"
                            rows="1"
                        ></textarea>
                        <button class="btn-send" id="btnSend" onclick="sendMessage()">发 送</button>
                        <button class="btn-stop" id="btnStop" onclick="stopGeneration()" style="display:none;">停 止</button>
                    </div>
                    <button class="btn-clear" onclick="clearCurrentConversation()">清空当前会话</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
